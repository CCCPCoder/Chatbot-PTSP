<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Training</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body>
    <div class="sidebar">
        <h2>Chatbot Admin</h2>
        <a href="/admin_app">Dashboard</a>
        <a href="/log">Log Training</a>
        <a href="/">Lihat Chatbot</a>
    </div>
    <div class="content">
        <h1>Log Training</h1>
            <div class="training-section">
            <h2>Pelatihan Model Chatbot</h2>
            <button id="trainButton" onclick="trainModel()" class="btn train">
                Latih Model
            </button>
            <p id="trainingStatus">
                Training belum dijalankan.
            </p>
            <pre
                id="trainingLog"
                style="
                    background:#111;
                    color:#00ff88;
                    padding:15px;
                    height:300px;
                    overflow-y:auto;
                    white-space:pre-wrap;
                "
            ></pre>
        </div>
    </div>
<script>

//Training Model
let trainingInterval = null;
async function trainModel() {
    const button =
        document.getElementById("trainButton");
    const confirmation = confirm(
        "Apakah Anda yakin ingin melatih ulang model?"
    );
    if (!confirmation) {
        return;
    }
    button.disabled = true;
    button.innerText =
        "Training dimulai...";
    try {
        const response = await fetch(
            "/admin/train",
            {
                method: "POST"
            }
        );
        const data =
            await response.json();
        console.log(data);
        startTrainingMonitor();
    } catch (error) {
        console.error(error);
        button.disabled = false;
        button.innerText =
            "Latih Model";
    }
}
//Monitor Training
function startTrainingMonitor() {
    if (trainingInterval !== null) {
        clearInterval(trainingInterval);
    }
    // Jalankan langsung
    checkTrainingStatus();
    // Kemudian ulangi setiap 5 detik
    trainingInterval = setInterval(() => {
        checkTrainingStatus();
    }, 5000);
}

async function checkTrainingStatus() {
    try {
        const response = await fetch(
            "/admin/train/status?t=" + Date.now()
        );
        const data = await response.json();
        document.getElementById(
            "trainingStatus"
        ).innerText = data.message;
        // PENTING: ambil log terbaru
        await loadTrainingLog();
        const button =
            document.getElementById("trainButton");
        if (data.running) {
            button.disabled = true;
            button.innerText = "Training...";
        } else {
            button.disabled = false;
            button.innerText = "Latih Model";
            if (trainingInterval !== null) {
                clearInterval(trainingInterval);
                trainingInterval = null;
            }
        }
    } catch (error) {
        console.error(
            "Error checkTrainingStatus:",
            error
        );
    }
}

async function loadTrainingLog() {
    try {
        console.log("Mengambil log terbaru...");
        const response = await fetch(
            "/admin/train/log?t=" + Date.now()
        );
        const data = await response.json();
        console.log(
            "Jumlah karakter log:",
            data.logs.length
        );
        const logElement =
            document.getElementById("trainingLog");
        logElement.textContent = data.logs;
        logElement.scrollTop =
            logElement.scrollHeight;
    } catch (error) {
        console.error(
            "Error loadTrainingLog:",
            error
        );
    }
}

document.addEventListener(
    "DOMContentLoaded",
    async function () {
        await checkTrainingStatus();
        const response = await fetch(
            "/admin/train/status?t=" + Date.now()
        );
        const data = await response.json();
        if (data.running) {
            startTrainingMonitor();
        }
    }
);
</script>
</body>
</html>
